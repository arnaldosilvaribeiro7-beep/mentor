name: Android CI / GitHub Actions Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APKs and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare Signing Key
        id: setup_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using official release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
            echo "signed_official=true" >> $GITHUB_OUTPUT
          else
            echo "Secrets not configured. Generating temporary self-signed keystore for release build..."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=GitHubManager, OU=Dev, O=GitHubManager, L=City, S=State, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "signed_official=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK and Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify Generated Artifacts
        run: |
          echo "=== Output Binaries ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk || echo "app-debug.apk missing"
          ls -lh app/build/outputs/apk/release/app-release.apk || echo "app-release.apk missing"
          ls -lh app/build/outputs/bundle/release/app-release.aab || echo "app-release.aab missing"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-manager-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-manager-apk-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-manager-aab-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Add Job Summary
        run: |
          echo "## GitHub Manager - Compilação Concluída com Sucesso! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Os seguintes artefatos foram gerados e estão disponíveis para download na seção **Artifacts** deste workflow:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tipo | Arquivo | Finalidade |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Debug** | \`app-debug.apk\` | Testes e instalação direta imediata no dispositivo |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Release** | \`app-release.apk\` | Versão otimizada para distribuição direta |" >> $GITHUB_STEP_SUMMARY
          echo "| **AAB Release** | \`app-release.aab\` | Pacote oficial para publicação na Google Play Store |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.setup_signing.outputs.signed_official }}" = "true" ]; then
            echo "✅ **Assinatura:** Assinado com a chave oficial configurada via GitHub Secrets." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Assinatura:** Compilado com chave Release temporária (configure os Secrets para usar sua chave oficial)." >> $GITHUB_STEP_SUMMARY
          fi
